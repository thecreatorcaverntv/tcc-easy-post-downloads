name: Free public builder · Verify published release
run-name: TCC · ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source branch or commit to build
        type: string
        default: main
        required: true
      tag:
        description: Release tag (blank uses package.json version)
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: thecreatorcaverntv/tcc-easy-post-source
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.TCC_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check release validation logic
        run: node --test test/release-ready.test.js
      - name: Verify public installers and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-v$(node -p "require('./package.json').version")}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          node scripts/release-ready.mjs thecreatorcaverntv/tcc-easy-post-downloads "$TAG" all --verify-only
          for MANIFEST in latest.yml latest-mac.yml; do
            curl --fail --silent --show-error --location --retry 3 "https://github.com/thecreatorcaverntv/tcc-easy-post-downloads/releases/download/$TAG/$MANIFEST" -o "/tmp/$MANIFEST"
            grep -Fx "version: ${TAG#v}" "/tmp/$MANIFEST"
          done
          echo "Verified $TAG: public Windows, Intel Mac, Apple Silicon Mac and update manifests." >> "$GITHUB_STEP_SUMMARY"
